version: 2

project_name: kessel

before:
  hooks:
    # Build the embedded UI before compiling (populates web/dist for go:embed).
    - sh -c "cd web && npm ci && npm run build"
    - go mod tidy

builds:
  - id: kessel
    main: ./cmd/kessel
    binary: kessel
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/t0mer/kessel/internal/version.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm, "386"]
    goarm: ["6", "7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: "386"

archives:
  - id: kessel
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  github:
    owner: t0mer
    name: kessel
  draft: false
  prerelease: auto
